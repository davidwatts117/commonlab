<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulation — CommonLab</title>
  <meta name="description" content="Interactive CommonLab science simulation.">
  <link rel="stylesheet" href="/main.css?v=4">
  <link rel="stylesheet" href="/simulation.css?v=2">
  <link rel="stylesheet" href="/guided.css?v=5">

</head>
<body>
  <header class="site-header">
    <div class="container nav-container">
      <a href="/" class="logo" aria-label="CommonLab Home"><span class="logo-icon">◆</span><span class="logo-text">CommonLab</span></a>
      <nav class="primary-nav" aria-label="Main navigation"><ul>
        <li><a href="/#simulations">Simulations</a></li>
        <li><a href="/#about">About</a></li>
        <li><a href="/#contact">Contact</a></li>
      </ul></nav>
    </div>
  </header>
  <main>
    <div class="sim-page-header"><div class="container">
      <h1 id="simulation-title">Loading simulation…</h1>
      <p id="simulation-summary"></p>
      <div id="lesson-launcher"></div>
    </div></div>

      <p id="simulation-status" class="container" role="status">Loading…</p>
      <div id="simulation-root" class="container sim-layout" hidden></div>
      <div class="container simulation-back"><a href="/#simulations" class="sim-back-link">← Back to Simulations</a></div>
    </section>
    <noscript><p class="container">Enable JavaScript to use this simulation.</p></noscript>
  </main>
  <footer class="site-footer"><div class="container footer-container"><p>© 2026 CommonLab. Free science simulations for everyone.</p></div></footer>
  <script src="/index.js?v=4"></script>
