<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulation: CommonLab</title>
  <meta name="description" content="Interactive CommonLab science simulation.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="paper">
  <header class="site-header">
    <div class="container nav-container">
      <a href="/" class="logo" aria-label="CommonLab Home"><svg class="logo-mark" width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 2 L28 15 L15 28 Z" fill="#892f35"/><path d="M15 2 L2 15 L15 28 Z" fill="#c14953"/></svg><span class="logo-text">CommonLab</span></a>
      <nav class="primary-nav" aria-label="Main navigation"><ul>
        <li><a href="/#simulations" class="sim-back-link">← All simulations</a></li>
      </ul></nav>
    </div>
  </header>
  <main>
    <div class="sim-page-header"><div class="container">
      <h1 id="simulation-title">Loading simulation…</h1>
      <p id="simulation-summary"></p>
      <div id="lesson-launcher"></div>
    </div></div>
    <section class="sim-canvas-area">
      <p id="simulation-status" class="container" role="status">Loading…</p>
      <div id="simulation-root" class="container sim-layout" hidden></div>
    </section>
    <section class="container certificate-host" aria-label="Completion certificate" hidden></section>
    <noscript><p class="container">Enable JavaScript to use this simulation.</p></noscript>
  </main>
  <footer class="site-footer"><div class="container footer-container"><p>© 2026 CommonLab. Free science simulations for everyone.</p></div></footer>
  <script src="/index.js?v=5"></script>
  <script src="/library.js?v=7"></script>
