# Private deployment behind a Cloudflare Tunnel; no host ports published.
name: commonlab
services:
  app:
    build:
      context: .
      # Host DNS is needed by this host's BuildKit network.
      network: host
    image: commonlab:local
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN}
      GENERATION_WORKER_TOKEN: ${GENERATION_WORKER_TOKEN:?Set worker token}
      COOKIE_SECURE: "true"
      RUST_LOG: commonlab=info,tower_http=info
    volumes:
      - commonlab-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=67108864,mode=1777
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 1g
    restart: unless-stopped

  generation-worker:
    profiles: [generation]
    build:
      context: .
      dockerfile: worker/Dockerfile
      network: host
    image: commonlab-worker:local
    depends_on:
      app:
        condition: service_healthy
    environment:
      CL_API_BASE_URL: http://app:8000
      CL_WORKER_ALLOW_HTTP: "true"
      GENERATION_WORKER_TOKEN: ${GENERATION_WORKER_TOKEN:?Set worker token}
      CL_MODEL_PROVIDER: openrouter
      CL_MODEL_ID: xiaomi/mimo-v2.6-flash
      CL_MODEL_API_KEY: ${CL_MODEL_API_KEY:-}
      CL_REVIEW_MODEL_PROVIDER: ${CL_REVIEW_MODEL_PROVIDER:-}
      CL_REVIEW_MODEL_ID: ${CL_REVIEW_MODEL_ID:-}
      CL_REVIEW_MODEL_API_KEY: ${CL_REVIEW_MODEL_API_KEY:-}
      CL_MODEL_REASONING_EFFORT: ${CL_MODEL_REASONING_EFFORT:-low}
      CL_REVIEW_REASONING_EFFORT: ${CL_REVIEW_REASONING_EFFORT:-}
      CL_REVIEW_IMAGES: ${CL_REVIEW_IMAGES:-1}
      CL_AUTHOR_IMAGES: ${CL_AUTHOR_IMAGES:-1}
      CL_PUBLIC_ROOT: /app/public
      CL_CHECKPOINT_DIR: /var/lib/commonlab/checkpoints
      CL_AGENT_TRACE_DIR: ${CL_AGENT_TRACE_DIR:-}
      CL_AGENT_TRACE_MAX_FILES: ${CL_AGENT_TRACE_MAX_FILES:-50}
      CL_AGENT_TRACE_MAX_BYTES: ${CL_AGENT_TRACE_MAX_BYTES:-8388608}
      CL_AGENT_TRACE_MAX_DAYS: ${CL_AGENT_TRACE_MAX_DAYS:-7}
    volumes:
      - generation-traces:/var/lib/commonlab/agent-traces
      - generation-checkpoints:/var/lib/commonlab/checkpoints
    read_only: true
    user: "10001:10001"
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    cpus: 2.0
    mem_limit: 2g
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=536870912,mode=1777
    restart: unless-stopped

  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    restart: unless-stopped

volumes:
  commonlab-data:
  generation-traces:
  generation-checkpoints:
