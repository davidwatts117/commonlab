# Private deployment behind a Cloudflare Tunnel; no host ports published.
name: commonlab
services:
  app:
    build:
      context: .
      # Host DNS is needed by this host's BuildKit network.
      network: host
    image: commonlab:local
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN}
      GENERATION_WORKER_TOKEN: ${GENERATION_WORKER_TOKEN:?Set worker token}
      COOKIE_SECURE: "true"
      RUST_LOG: commonlab=info,tower_http=info
    volumes:
      - commonlab-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=67108864,mode=1777
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 1g
    restart: unless-stopped

  generation-worker:
    profiles: [generation]
    build:
      context: .
      dockerfile: worker/Dockerfile
      network: host
    image: commonlab-worker:local
    depends_on:
      app:
        condition: service_healthy
    environment:
      CL_API_BASE_URL: http://app:8000
      CL_WORKER_ALLOW_HTTP: "true"
      GENERATION_WORKER_TOKEN: ${GENERATION_WORKER_TOKEN:?Set worker token}
      CL_MODEL_PROVIDER: openrouter
      CL_MODEL_ID: xiaomi/mimo-v2.6-flash
      CL_MODEL_API_KEY: ${CL_MODEL_API_KEY:-}
    read_only: true
    user: "10001:10001"
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    cpus: 1.0
    mem_limit: 1g
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=134217728,mode=1777
    restart: unless-stopped

  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    restart: unless-stopped

volumes:
  commonlab-data:
