services:
  generation-worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    read_only: true
    user: "10001:10001"
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    cpus: 1.0
    mem_limit: 1g
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=134217728,mode=1777
    environment:
      CL_API_BASE_URL: ${CL_API_BASE_URL:?Set the HTTPS application origin}
      GENERATION_WORKER_TOKEN: ${GENERATION_WORKER_TOKEN:?Set worker token}
      CL_MODEL_PROVIDER: ${CL_MODEL_PROVIDER:?Set provider}
      CL_MODEL_ID: ${CL_MODEL_ID:?Select an explicit model}
      CL_MODEL_API_KEY: ${CL_MODEL_API_KEY:?Set a dedicated provider API key}
      CL_WORKER_ALLOW_HTTP: ${CL_WORKER_ALLOW_HTTP:-false}
    restart: unless-stopped
